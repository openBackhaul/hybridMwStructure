########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        description: 'Empty string accepted from external applications.'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        description: 'Empty string accepted from external applications.'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
    mountName:
      name: mountName
      in: path
      required: true
      schema:
        type: string
        example: '222250001'
      description: 'The mountName of the device that is addressed by the request'
    uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within the device'
    uuid1:
      name: uuid1
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Another instance identifier that is unique within the device'
    localId:
      name: localId
      in: path
      required: true
      schema:
        type: string
        example: 'LP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within its list'
    fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
        example: 'node(node-id;netconf-node-topology:connection-status)'
      description: 'Query parameter to filter ressources according to RFC8040 fields filter spec'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
        backend-time:
          schema:
            type: integer
            example: 850
          description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  headers:
    x-correlator:
      schema:
        type: string
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
    exec-time:
      schema:
        type: integer
        example: 1100
      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    backend-time:
      schema:
        type: integer
        example: 850
      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    life-cycle-state:
      schema:
        type: string
        enum:
          - 'EXPERIMENTAL'
          - 'OPERATIONAL'
          - 'DEPRECATED'
          - 'OBSOLETE'
          - 'UNKNOWN'
          - 'NOT_YET_DEFINED'
        example: 'EXPERIMENTAL'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    hybrid-mw-structure-capability:
      type: object
      required:
        - supported-tdm-structure-kind-list
        - performance-monitoring-is-avail
      properties:
        supported-tdm-structure-kind-list:
          type: array
          minItems: 1
          x-key: tdm-structure-name
          items:
            type: object
            properties:
              tdm-structure-name:
                type: string
                enum:
                  - 'e1'
                  - 't1'
                  - 'j1'
                  - 'e3'
                  - 'ds3'
                  - 'stm1'
                  - 'cpri1'
                  - 'cpri2'
                  - 'cpri3'
                  - 'cpri4'
                  - 'cpri5'
                  - 'cpri6'
                  - 'cpri7'
              tdm-segment-size:
                type: integer
                format: int32
              max-number-of-segments-reservable:
                type: integer
                format: int8
        performance-monitoring-is-avail:
          type: boolean
    hybrid-mw-structure-configuration:
      type: object
      required:
        - tdm-structure-kind
        - number-of-tdm-segments-to-be-reserved
        - performance-monitoring-is-on
      properties:
        tdm-structure-kind:
          type: string
        number-of-tdm-segments-to-be-reserved:
          type: integer
          format: int8
        g-826-threshold-cross-alarm-list:
          type: array
          minItems: 0
          x-key: g-826-value-kind granularity-period
          items:
            type: object
            required:
              - g-826-value-kind
              - alarm-raising-threshold
              - alarm-clearing-threshold
              - granularity-period
            properties:
              g-826-value-kind:
                type: string
                enum:
                  - 'hybrid-mw-structure-2-0:G_826_TYPE_ES'
                  - 'hybrid-mw-structure-2-0:G_826_TYPE_SES'
                  - 'hybrid-mw-structure-2-0:G_826_TYPE_CSES'
                  - 'hybrid-mw-structure-2-0:G_826_TYPE_UAS'
                  - 'hybrid-mw-structure-2-0:G_826_TYPE_NOT_SPECIFIED'
              alarm-raising-threshold:
                type: integer
                format: int32
              alarm-clearing-threshold:
                type: integer
                format: int32
              granularity-period:
                type: string
                enum:
